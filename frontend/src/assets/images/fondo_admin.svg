        <path d="M 800 -100 A 1200 1200 0 0 1 2000 1100" />
        <path d="M 840 -100 A 1200 1200 0 0 1 2040 1100" />
        <path d="M 880 -100 A 1200 1200 0 0 1 2080 1100" />
        <path d="M 920 -100 A 1200 1200 0 0 1 2120 1100" />
        <path d="M 960 -100 A 1200 1200 0 0 1 2160 1100" />
        <path d="M 1000 -100 A 1200 1200 0 0 1 2200 1100" />
        <path d="M 1040 -100 A 1200 1200 0 0 1 2240 1100" />
        <path d="M 1080 -100 A 1200 1200 0 0 1 2280 1100" />
        <path d="M 1120 -100 A 1200 1200 0 0 1 2320 1100" />
        <path d="M 1160 -100 A 1200 1200 0 0 1 2360 1100" />
    </g>
</svg>
