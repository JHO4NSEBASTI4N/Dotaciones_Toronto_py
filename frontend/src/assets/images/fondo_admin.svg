<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
    <defs>
        <radialGradient id="indigo-glow" cx="80%" cy="0%" r="50%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="amber-glow" cx="90%" cy="100%" r="40%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Fondo Base -->
    <rect width="100%" height="100%" fill="#f8fafc"/>
    <rect width="100%" height="100%" fill="url(#indigo-glow)"/>
    <rect width="100%" height="100%" fill="url(#amber-glow)"/>

    <!-- Curvas Vectoriales (Infinitamente nítidas) -->
